name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Python 3.12 / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    env:
      HESTON_LAB_OFFLINE: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install pinned development dependencies (no provider client)
        run: python -m pip install -c constraints/py312.txt -e ".[dev]"
      - name: Validate dependency graph
        run: python -m pip check
      - name: Reproduce committed synthetic evidence
        run: python -m heston_arb_lab.cli synthetic-evidence
      - name: Verify synthetic evidence is byte-for-byte deterministic
        run: git diff --exit-code -- docs/assets/synthetic_evidence.json docs/assets/synthetic_evidence.svg
      - name: Test
        run: python -m pytest -q
      - name: Ruff check
        run: python -m ruff check .
      - name: Ruff format
        run: python -m ruff format --check .
      - name: Mypy
        run: python -m mypy src
      - name: Validate pre-commit configuration
        run: python -m pre_commit validate-config .pre-commit-config.yaml
      - name: Run pre-commit hooks
        run: python -m pre_commit run --all-files
      - name: Publication guard
        run: python scripts/publication_guard.py
      - name: Validate Markdown links
        run: python scripts/check_markdown_links.py
      - name: Build package
        run: python -m build
      - name: Offline CLI smoke test
        run: python -m heston_arb_lab.cli demo
      - name: Ensure generated artefacts are ignored and tracked tree is unchanged
        shell: bash
        run: test -z "$(git status --short --untracked-files=all)"
