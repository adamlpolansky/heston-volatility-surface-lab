[build-system]
requires = ["setuptools==80.9.0", "wheel==0.45.1"]
build-backend = "setuptools.build_meta"

[project]
name = "heston-volatility-surface-lab"
version = "1.1.0"
description = "Offline Heston and SSVI volatility-surface research and diagnostic pipeline."
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = "MIT"
authors = [{ name = "Adam Luboš Polanský" }]
keywords = [
  "options-pricing",
  "volatility-surface",
  "heston-model",
  "ssvi",
  "static-arbitrage",
  "quantitative-finance",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Financial and Insurance Industry",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3.12",
  "Topic :: Office/Business :: Financial :: Investment",
]
dependencies = [
  "numpy>=2.5,<3",
  "pandas>=3.0,<4",
  "pydantic>=2.13,<3",
  "rich>=15,<16",
  "scipy>=1.18,<2",
  "typer>=0.26,<1",
]

[project.optional-dependencies]
providers = [
  "duckdb>=1.5,<2",
  "pyarrow>=24,<25",
  "thetadata>=1.0.9,<2",
]
dev = [
  "build>=1.3,<2",
  "hypothesis>=6.155,<7",
  "mypy>=2.1,<3",
  "pre-commit>=4.6,<5",
  "pytest>=9.1,<10",
  "pytest-cov>=7.1,<8",
  "ruff>=0.15,<1",
]

[project.scripts]
heston-lab = "heston_arb_lab.cli:app"

[project.urls]
Source = "https://github.com/adamlpolansky/heston-volatility-surface-lab"
Issues = "https://github.com/adamlpolansky/heston-volatility-surface-lab/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "N", "RUF"]
ignore = ["B008"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.12"
packages = ["heston_arb_lab"]
warn_unused_configs = true
warn_return_any = true
warn_unused_ignores = true
ignore_missing_imports = true
disallow_untyped_defs = true
no_implicit_optional = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers --strict-config"
